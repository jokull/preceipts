[package]
name = "preceipts-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The lab's scriptable face: workspaces, diffs, and status for humans and agents."

[[bin]]
name = "preceipts"
path = "src/main.rs"

[dependencies]
preceipts-core = { path = "../preceipts-core" }
preceiptsd = { path = "../preceiptsd" }
anyhow = "1"
usage = { package = "usage-rs", version = "6" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
