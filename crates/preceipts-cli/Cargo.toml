[package]
name = "preceipts-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The lab's scriptable face: workspaces, diffs, and status for humans and agents."

[[bin]]
name = "preceipts"
path = "src/main.rs"

[dependencies]
preceipts-core = { path = "../preceipts-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
