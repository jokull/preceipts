[package]
name = "preceiptsd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The workbench daemon: process supervision, healthchecks, local HTTPS, Keychain secrets."

[lib]
name = "preceiptsd"
path = "src/lib.rs"

[[bin]]
name = "preceiptsd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
humantime = "2"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
globset = "0.4"
walkdir = "2"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"
regex = "1"
parking_lot = "0.12"
once_cell = "1"
ctrlc = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
dirs = "5"
time = "0.3"
magic-wormhole = { version = "0.8", default-features = false, features = ["transit"] }
preceipts-core = { version = "0.1.0", path = "../preceipts-core" }
usage = { package = "usage-rs", version = "6" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Building a keychain ACL needs Security.framework directly: the safe wrapper
# exposes the opaque SecAccess type and nothing that constructs one. See acl.rs.
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
