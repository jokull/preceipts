[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jokull/preceipts"

# Profiles are workspace-level only; cargo ignores them in member manifests.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
